services:
  backend:
    build: ./back
    container_name: backend_container
    ports:
      - "5000:5000"
    networks:
      - app-network

  frontend:
    build: ./dash
    container_name: frontend_container
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge